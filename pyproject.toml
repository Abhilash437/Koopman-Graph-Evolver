[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "koopman-graph-evolver"
version = "0.1.1"
description = "Geometry-Preserving Latent Dynamics & SE(3)-Equivariant Koopman Operators for Long-Horizon Graph Simulation"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Abhilash Hathwar", email = "abhilashhathwar@gmail.com" }
]
keywords = [
    "koopman-operator",
    "graph-neural-networks",
    "geometric-deep-learning",
    "equivariant-neural-networks",
    "molecular-dynamics",
    "physics-informed-machine-learning",
    "n-body-simulation"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Chemistry"
]
requires-python = ">=3.9"

dependencies = [
    "torch>=2.0.0",
    "torch-geometric>=2.3.0",
    "networkx>=3.0",
    "numpy>=1.21.0",
    "scipy>=1.7.0",
    "scikit-learn>=1.0.0",
]

[project.optional-dependencies]
gui = [
    "streamlit>=1.20.0",
    "matplotlib>=3.5.0",
]
data = [
    "kagglehub",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "build>=1.0.0",
    "twine>=4.0.0",
]
all = [
    "koopman-graph-evolver[gui,data,dev]",
]

[project.urls]
Homepage = "https://github.com/Abhilash437/Koopman-Graph-Evolver"
Repository = "https://github.com/Abhilash437/Koopman-Graph-Evolver"
Paper = "https://github.com/Abhilash437/Koopman-Graph-Evolver/blob/main/paper/main.tex"
"Bug Tracker" = "https://github.com/Abhilash437/Koopman-Graph-Evolver/issues"

[project.scripts]
koopman-graph-evolver = "koopman_evolver.cli:main"
koopman-evolver = "koopman_evolver.cli:main"
kge = "koopman_evolver.cli:main"


[tool.hatch.build.targets.wheel]
packages = ["koopman_evolver"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v"
